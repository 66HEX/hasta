name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies from lockfile
        env:
          NUCLEO_LICENSE_KEY: ${{ secrets.NUCLEO_LICENSE_KEY }}
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm run audit:dependencies

      - name: Run quality gate and build
        run: npm run ci:quality

      - name: Test packed consumers with current and minimum peers
        run: npm run release:consumers

  browser:
    name: browser (${{ matrix.suite }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: library
            directory: packages/hasta
            command: npx playwright test
          - suite: adapters
            directory: packages/hasta
            command: npm run test:frameworks
          - suite: web
            directory: apps/web
            command: npm test
          - suite: lab
            directory: apps/lab
            command: npm test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies from lockfile
        env:
          NUCLEO_LICENSE_KEY: ${{ secrets.NUCLEO_LICENSE_KEY }}
        run: npm ci

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build all workspaces
        run: npm run build

      - name: Test ${{ matrix.suite }} in all browsers
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

      - name: Preserve browser failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ matrix.suite }}
          path: ${{ matrix.directory }}/test-results
          if-no-files-found: ignore
          retention-days: 14
