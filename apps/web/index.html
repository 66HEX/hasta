<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track elements, predict pointer motion, and prepare for the next interaction with Hasta."
    />
    <meta name="theme-color" content="#fcfcfc" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hasta · A little ahead of the pointer</title>
    <script>
      try {
        const savedTheme =
          localStorage.getItem('hasta.theme') ?? localStorage.getItem('futura.theme');
        const darkTheme =
          savedTheme === 'dark' ||
          (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', darkTheme);
        document.documentElement.style.colorScheme = darkTheme ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
